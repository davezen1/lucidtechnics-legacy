<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Lucid Technics was a consulting company founded by David Hodge.">
    <title>Lucid Technics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400&family=Inter:wght@300&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --muted-text: #333333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
            text-align: center;
        }

        main {
            width: 100%;
            max-width: 1200px;
            padding: 0 1rem;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: clamp(2.5rem, 8vw, 6rem);
            font-weight: 400;
            letter-spacing: 0.15em;
            margin-bottom: 2rem;
            text-transform: uppercase;
            line-height: 1.1;
            color: #111;
        }

        p {
            font-size: clamp(1rem, 2vw, 1.25rem);
            line-height: 1.8;
            color: var(--muted-text);
            font-weight: 300;
            max-width: 700px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <main>
        <h1>LUCID TECHNICS</h1>
        <p>Lucid Technics was a consulting company founded by David Hodge that served startups, non-profits, Fortune 500 companies, and large government agencies.</p>
    </main>
</body>
</html>
