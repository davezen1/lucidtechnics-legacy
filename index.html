<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Lucid Technics was a consulting company founded by David Hodge.">
    <title>Lucid Technics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400&family=Inter:wght@300&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --muted-text: #333333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
            text-align: center;
        }

        main {
            max-width: 600px;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.5rem;
            font-weight: 400;
            letter-spacing: 4px;
            margin-bottom: 2rem;
            text-transform: uppercase;
        }

        p {
            font-size: 1.125rem;
            line-height: 1.8;
            color: var(--muted-text);
            font-weight: 300;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.25rem;
                letter-spacing: 3px;
            }
            p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>LUCID TECHNICS</h1>
        <p>Lucid Technics was a consulting company founded by David Hodge that served startups, non-profits, Fortune 500 companies, and large government agencies.</p>
    </main>
</body>
</html>
